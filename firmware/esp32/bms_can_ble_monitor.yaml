substitutions:
  name: "solarcontrol-battery-bms-node"
  friendly_name: "Solar Battery BMS Node"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "ESP32 CAN Bus and BLE Battery Monitor for SolarControl-io"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

logger:
  level: INFO

# Networking: Wi-Fi with Native HA API
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Bluetooth LE Client for Wireless BMS (JK-BMS, JBD, Daly)
esp32_ble_tracker:

ble_client:
  - mac_address: !secret bms_ble_mac
    id: jk_bms_client

# CAN Bus Interface (SN65HVD230 or VP230 transceiver) for Pylontech / EG4 / Seplos
canbus:
  - platform: esp32_can
    id: can_bus
    tx_pin: GPIO5
    rx_pin: GPIO4
    can_id: 1
    bit_rate: 500kbps

sensor:
  # Telemetry published to Home Assistant for SolarControl-io BESS optimization
  - platform: template
    name: "Battery State of Charge"
    id: battery_soc
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "Battery Voltage"
    id: battery_voltage
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2

  - platform: template
    name: "Battery Current"
    id: battery_current
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2

  - platform: template
    name: "Battery Power"
    id: battery_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      return id(battery_voltage).state * id(battery_current).state;

  - platform: template
    name: "Max Cell Delta Voltage"
    id: bms_cell_delta
    unit_of_measurement: "mV"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1

binary_sensor:
  - platform: template
    name: "BMS Charge Over-Current Alarm"
    device_class: problem
    id: bms_alarm_charge_oc
