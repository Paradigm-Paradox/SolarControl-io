substitutions:
  name: "solarcontrol-inverter-bridge"
  friendly_name: "Solar Inverter RS485 Bridge"
  # Change to true if using Ethernet board (WT32-ETH01, Olimex ESP32-POE)
  use_ethernet: "false"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "ESP32 RS485 Modbus Inverter Bridge for SolarControl-io"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Native API for ultra-low latency encrypted link to Home Assistant
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

logger:
  level: INFO
  baud_rate: 0 # Free UART0 if needed

# Network: Wi-Fi with Ethernet fallback / support
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "SolarInverter-Fallback"

# Optional Wired Ethernet Configuration (e.g. WT32-ETH01 / Olimex ESP32-POE)
# ethernet:
#   type: LAN8720
#   mdc_pin: GPIO23
#   mdio_pin: GPIO18
#   clk_mode: GPIO0_IN
#   phy_addr: 1
#   power_pin: GPIO16

# Hardware UART connection to RS485 Transceiver (MAX485 / SP3485)
uart:
  id: modbus_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  stop_bits: 1

modbus:
  id: modbus_hub
  uart_id: modbus_uart
  flow_control_pin: GPIO4

modbus_controller:
  - id: inverter
    address: 1
    modbus_id: modbus_hub
    setup_priority: -10
    update_interval: 2s

sensor:
  # SunSpec / Standard Hybrid Inverter Telemetry
  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Inverter AC Active Power"
    id: inverter_active_power
    register_type: holding
    address: 40083
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    value_type: S_WORD

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Inverter Daily Yield"
    id: inverter_daily_yield
    register_type: holding
    address: 40093
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    value_type: U_DWORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Inverter DC PV1 Voltage"
    register_type: holding
    address: 40101
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    value_type: U_WORD
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Inverter DC PV1 Current"
    register_type: holding
    address: 40102
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    value_type: U_WORD
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: inverter
    name: "Inverter Temperature"
    register_type: holding
    address: 40103
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    value_type: S_WORD
    filters:
      - multiply: 0.1
