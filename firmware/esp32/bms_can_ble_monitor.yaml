substitutions:
  name: "solarcontrol-battery-bms-node"
  friendly_name: "Solar Battery BMS Node"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "ESP32 CAN Bus and BLE Battery Monitor for SolarControl-io"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

logger:
  level: INFO

# Networking: Wi-Fi with Native HA API
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Bluetooth LE Client for Wireless BMS (JK-BMS, JBD, Daly)
esp32_ble_tracker:

ble_client:
  - mac_address: !secret bms_ble_mac
    id: jk_bms_client

# CAN Bus Interface (SN65HVD230 / VP230 3.3V transceiver) for Pylontech / EG4 / Seplos
canbus:
  - platform: esp32_can
    id: can_bus
    tx_pin: GPIO5
    rx_pin: GPIO4
    bit_rate: 500kbps
    on_frame:
      # Pylontech / EG4 Frame 0x356: Voltage (0.01V), Current (0.1A), SoC (1%), SoH (1%)
      - can_id: 0x356
        then:
          - lambda: |-
              if (x.size() >= 6) {
                // Byte 0-1: Voltage (0.01V signed)
                float v = (float)((int16_t)(x[0] | (x[1] << 8))) * 0.01f;
                id(battery_voltage).publish_state(v);

                // Byte 2-3: Current (0.1A signed, positive=charge, negative=discharge)
                float c = (float)((int16_t)(x[2] | (x[3] << 8))) * 0.1f;
                id(battery_current).publish_state(c);

                // Byte 4-5: SoC (1%)
                float soc = (float)((int16_t)(x[4] | (x[5] << 8)));
                id(battery_soc).publish_state(soc);

                // Calculate active power in Watts
                id(battery_power).publish_state(v * c);
              }
      # Frame 0x359: Protection Alarms
      - can_id: 0x359
        then:
          - lambda: |-
              if (x.size() >= 1) {
                bool oc_alarm = (x[0] & 0x01) != 0;
                id(bms_alarm_charge_oc).publish_state(oc_alarm);
              }

sensor:
  # Telemetry published to Home Assistant for SolarControl-io BESS optimization
  - platform: template
    name: "Battery State of Charge"
    id: battery_soc
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      return id(battery_soc).has_state() ? id(battery_soc).state : 0.0f;

  - platform: template
    name: "Battery Voltage"
    id: battery_voltage
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      return id(battery_voltage).has_state() ? id(battery_voltage).state : 0.0f;

  - platform: template
    name: "Battery Current"
    id: battery_current
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      return id(battery_current).has_state() ? id(battery_current).state : 0.0f;

  - platform: template
    name: "Battery Power"
    id: battery_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      return id(battery_power).has_state() ? id(battery_power).state : 0.0f;

  - platform: template
    name: "Max Cell Delta Voltage"
    id: bms_cell_delta
    unit_of_measurement: "mV"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      return id(bms_cell_delta).has_state() ? id(bms_cell_delta).state : 0.0f;

binary_sensor:
  - platform: template
    name: "BMS Charge Over-Current Alarm"
    device_class: problem
    id: bms_alarm_charge_oc
    lambda: |-
      return id(bms_alarm_charge_oc).has_state() ? id(bms_alarm_charge_oc).state : false;
